<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мобильный супервайзинг — прототип по ролям</title>
<style>
:root{
  --bg:#f3f3f3; --card:#fff;
  --ink:#002033; --ink-60:rgba(0,32,51,.6); --ink-30:rgba(0,32,51,.3);
  --stripe:rgba(0,66,105,.06); --line:rgba(0,98,156,.2);
  --brand:#3c7adf; --brand-press:#2f66c2;
  --alert:#eb5757; --warn:#f38b00; --warn-ink:#e77602;
  --success:#22c38e; --success-ink:#09b37b; --info:#3e83df;
  --r:12px; --r-s:8px;
  --shadow:0 2px 4px rgba(0,32,51,.08), 0 0 6px rgba(0,32,51,.02);
  --shadow-up:0 -2px 12px rgba(0,32,51,.12);
  --hdr:60px; --nav:60px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:Inter,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:#e6e8ea;color:var(--ink);
  margin:0;min-height:100vh;display:flex;
}
.side{
  width:380px;flex:none;height:100vh;position:sticky;top:0;overflow-y:auto;
  background:#fff;border-right:1px solid rgba(0,32,51,.10);padding:20px 18px 28px;
  display:flex;flex-direction:column;gap:18px;
}
.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
.desk{
  display:none;width:1440px;height:calc(100vh - 48px);max-height:940px;background:var(--bg);
  border-radius:16px;overflow:hidden;box-shadow:0 24px 60px rgba(0,32,51,.22);
}
.desk.on{display:flex}
.dside{width:196px;flex:none;background:var(--card);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:14px 10px;gap:2px}
.dlogo{display:flex;gap:10px;align-items:center;padding:6px 8px 16px}
.dlogo b{font-size:11px;line-height:14px;font-weight:700;display:block}
.dlogo span{font-size:10px;line-height:13px;color:var(--ink-60);display:block}
.dnav{display:flex;align-items:center;gap:10px;padding:8px 10px;border:0;border-radius:8px;
  background:none;cursor:pointer;font:inherit;font-size:12px;color:var(--ink);text-align:left;width:100%}
.dnav:hover{background:var(--stripe)}
.dnav.on{background:rgba(60,122,223,.10);color:var(--brand);font-weight:600}
.dnav .ic{width:18px;height:18px;display:grid;place-items:center;color:currentColor}
.dsep{height:1px;background:var(--line);margin:10px 4px}
.dgrp{font-size:9px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-30);padding:8px 10px 4px}
.dmain{flex:1;display:flex;flex-direction:column;min-width:0}
.dtop{height:56px;flex:none;background:var(--card);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:16px;padding:0 24px}
.dsearch{flex:1;max-width:520px;height:36px;border-radius:8px;background:var(--stripe);
  display:flex;align-items:center;gap:8px;padding:0 12px;font-size:13px;color:var(--ink-30)}
.dtop .right{margin-left:auto;display:flex;align-items:center;gap:12px}
.dtop .sup{text-align:right;font-size:10px;line-height:13px;color:var(--ink-60)}
.dbody{flex:1;overflow-y:auto;padding:24px}
.dcontent{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.desk .hero{margin:0;border-radius:16px;padding:22px 24px 24px}
.desk .metrics{grid-template-columns:repeat(4,1fr);margin:0}
.desk .metric .m-value{font-size:26px;line-height:30px}
.desk .tiles{display:flex;flex-wrap:wrap;gap:10px}
.desk .card{padding:20px}
.desk .h1{font-size:20px;line-height:26px}
.dcols{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
@media (max-width:1560px){.desk{width:1200px}}
@media (max-width:1320px){.desk{width:1040px}}
/* на десктопе шрифты крупнее мобильных */
.desk .t10{font-size:11px;line-height:15px}
.desk .t11{font-size:12px;line-height:16px}
.desk .t12{font-size:13px;line-height:18px}
.desk .t14{font-size:15px;line-height:21px}
.desk .h2{font-size:18px;line-height:24px}
.desk .badge{height:24px;font-size:12px;padding:0 10px}
.desk .metric .m-label{font-size:12px;line-height:16px}
.desk .metric .m-note{font-size:12px;line-height:16px}
.desk .kv{font-size:13px;line-height:18px}
.desk .kv b{width:180px}
.desk .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.desk .tiles>div{width:auto!important}
.desk .dsheet{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.desk .progress{height:8px}
.dside{width:220px;padding:16px 12px}
.dnav{font-size:13px;padding:9px 10px}
.dbody{padding:28px}
.side h3{margin:0;font-size:15px;font-weight:700}
.side .cap{font-size:10px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-30)}
.roles{display:flex;flex-direction:column;gap:6px}
.role{
  display:flex;gap:10px;align-items:flex-start;text-align:left;padding:10px 12px;
  border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;font:inherit;
}
.role:hover{border-color:var(--brand)}
.role[aria-pressed="true"]{border-color:var(--brand);background:rgba(60,122,223,.06);box-shadow:inset 0 0 0 1px var(--brand)}
.role[disabled]{opacity:.45;cursor:not-allowed}
.role .av{
  width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;
  font-size:11px;font-weight:700;color:#fff;background:linear-gradient(135deg,#8910d3,#1c51ba);
}
.role.contractor .av{background:linear-gradient(135deg,#f38b00,#c93f3f)}
.role.roving .av{background:linear-gradient(135deg,#22c38e,#1c51ba)}
.role.office .av{background:#9fb0ba}
.role b{display:block;font-size:12px;line-height:16px;font-weight:600}
.role span{display:block;font-size:10px;line-height:14px;color:var(--ink-60);margin-top:1px}
.modehint{background:var(--stripe);border-radius:8px;padding:9px 11px;font-size:11px;line-height:16px;color:var(--ink-60)}
.modehint b{color:var(--ink);font-weight:600}

.map{display:flex;flex-direction:column;gap:2px}
.map .grp{font-size:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-30);margin:10px 0 2px}
.mapitem{
  display:flex;align-items:center;gap:8px;padding:7px 10px;border:0;border-radius:8px;
  background:none;cursor:pointer;font:inherit;font-size:12px;line-height:16px;color:var(--ink);text-align:left;width:100%;
}
.mapitem:hover{background:var(--stripe)}
.mapitem.on{background:var(--brand);color:#fff}
.mapitem.on .mnum{background:rgba(255,255,255,.25);color:#fff}
.mapitem.sub{padding-left:26px;font-size:11px;color:var(--ink-60)}
.mapitem.sub.on{color:#fff}
.mapitem.off{opacity:.35;cursor:not-allowed}
.mnum{
  min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--stripe);
  font-size:10px;font-weight:600;line-height:18px;text-align:center;color:var(--ink-60);margin-left:auto;
}
.mnum.alert{background:rgba(235,87,87,.15);color:#c93f3f}
.devrow{display:flex;gap:6px}
.devrow button{
  flex:1;height:32px;border-radius:8px;border:1px solid var(--line);background:#fff;
  font:inherit;font-size:11px;color:var(--ink);cursor:pointer;
}
.devrow button:hover{border-color:var(--brand)}
@media (max-width:1180px){
  .side{display:none}
  .stage{padding:0}
}
.phone{
  position:relative;width:375px;height:812px;background:var(--bg);
  border-radius:28px;overflow:hidden;box-shadow:0 24px 60px rgba(0,32,51,.28);
  display:flex;flex-direction:column;flex:none;
}
@media (max-width:1100px){
  body{display:block;padding:0;background:var(--bg)}
  .phone{width:100%;height:100dvh;border-radius:0;box-shadow:none}
  .devtools{display:none!important}
}

/* ---------- status bar ---------- */
.statusbar{
  flex:none;height:28px;background:var(--card);display:flex;align-items:center;
  padding:0 16px;gap:8px;z-index:7;font-size:12px;font-weight:600;line-height:16px;color:var(--ink);
}
.statusbar .sysicons{display:flex;align-items:center;gap:6px;margin-left:auto}
.statusbar svg{display:block}

/* ---------- header ---------- */
.hdr{
  flex:none;height:var(--hdr);background:var(--card);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:8px;padding:0 12px;z-index:6;
}
.iconbtn{
  width:40px;height:40px;flex:none;border:0;border-radius:var(--r-s);
  background:var(--stripe);color:var(--ink);
  display:grid;place-items:center;cursor:pointer;position:relative;
}
.iconbtn:active{background:rgba(0,66,105,.12)}
.iconbtn.ghost{background:transparent}
.hdr-logo{width:28px;height:28px;flex:none;border-radius:7px;overflow:hidden;display:block}
.hdr-titles{flex:1;min-width:0}
.avatar{
  width:32px;height:32px;flex:none;border-radius:50%;border:0;cursor:pointer;padding:0;
  background:linear-gradient(135deg,#8910d3,#1c51ba);color:#fff;
  font:inherit;font-size:11px;font-weight:600;letter-spacing:.2px;
  display:grid;place-items:center;
}
.hdr-title{font-size:16px;font-weight:600;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-ctx{display:flex;align-items:center;gap:4px;font-size:11px;line-height:14px;color:var(--ink-60);white-space:nowrap;overflow:hidden}
.hdr-obj{display:flex;align-items:center;gap:3px;background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr-obj svg{flex:none;opacity:.5}
.conn{display:flex;align-items:center;gap:4px;background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer}
.dot{width:6px;height:6px;border-radius:50%;flex:none;background:var(--success)}
.dot.off{background:var(--warn)}
.counter{
  position:absolute;top:2px;right:2px;min-width:16px;height:16px;padding:0 4px;
  border-radius:8px;background:var(--alert);color:#fff;
  font-size:10px;font-weight:600;line-height:16px;text-align:center;
}
.counter.one{padding:0;width:16px}

/* ---------- scroll body ---------- */
.body{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.screen{padding:12px 12px 88px;display:flex;flex-direction:column;gap:16px}
.screen.has-bar{padding-bottom:150px}
.screen.no-nav{padding-bottom:132px}

/* ---------- primitives ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.card.tap{cursor:pointer}
.card.tap:active{transform:scale(.995)}
.row{display:flex;align-items:center;gap:12px}
.col{display:flex;flex-direction:column;min-width:0}
.grow{flex:1;min-width:0}
.h1{font-size:18px;font-weight:700;line-height:24px}
.h2{font-size:16px;font-weight:700;line-height:22px}
.h3{font-size:15px;font-weight:600;line-height:20px}
.t14{font-size:14px;font-weight:600;line-height:20px}
.t12{font-size:12px;line-height:17px}
.t11{font-size:11px;line-height:15px}
.t10{font-size:10px;line-height:14px}
.muted{color:var(--ink-60)}
.ghosted{color:var(--ink-30)}
.link{color:var(--brand);font-weight:500;cursor:pointer}
.hr{height:1px;background:var(--line);margin:0}
.iconbox{width:40px;height:40px;flex:0 0 40px;min-width:40px;aspect-ratio:1;border-radius:var(--r-s);background:var(--stripe);display:grid;place-items:center;color:var(--ink-60)}
.iconbox.s{width:32px;height:32px;flex:0 0 32px;min-width:32px}
.iconbox svg{flex:none}

.badge{
  display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:10px;
  font-size:11px;font-weight:600;line-height:1;white-space:nowrap;color:#fff;
}
.badge.alert{background:var(--alert)} .badge.warn{background:var(--warn)}
.badge.info{background:var(--info)} .badge.success{background:var(--success)}
.badge.normal{background:var(--info)}
.badge.out.normal{background:transparent;border:1px solid currentColor;color:var(--info)}
.badge.out{background:transparent;border:1px solid currentColor}
.badge.out.alert{color:var(--alert)} .badge.out.warn{color:var(--warn-ink)}
.badge.out.success{color:var(--success-ink)} .badge.out.info{color:var(--info)}
.badge.tint{background:var(--stripe);color:var(--ink-60)}
.badge.tint.alert{background:rgba(235,87,87,.14);color:#c93f3f}
.badge.tint.warn{background:rgba(243,139,0,.16);color:#b96700}
.badge.tint.success{background:rgba(34,195,142,.16);color:#0b8f63}
.badge.tint.system{background:rgba(62,131,223,.14);color:#2f66c2}

.btn{
  height:48px;border:0;border-radius:var(--r-s);font-size:15px;font-weight:600;
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:0 16px;font-family:inherit;
}
.btn.primary{background:var(--brand);color:#fff}
.btn.primary:active{background:var(--brand-press)}
.btn.secondary{background:transparent;color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.btn.clear{background:transparent;color:var(--brand)}
.btn.block{width:100%}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.s{height:40px;font-size:14px}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{
  background:var(--card);border:0;border-radius:10px;box-shadow:var(--shadow);
  padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:1px;
  cursor:pointer;font:inherit;color:var(--ink);
}
.stat b{font-size:18px;font-weight:700;line-height:22px}
.stat span{font-size:10px;line-height:14px;color:var(--ink-60);white-space:nowrap}
.stat.t-new b{color:var(--alert)} .stat.t-work b{color:var(--warn-ink)} .stat.t-done b{color:var(--success-ink)}
.stat.on{background:var(--brand);box-shadow:var(--shadow),inset 0 0 0 1px var(--brand)}
.stat.on b,.stat.on span{color:#fff}

.seg{display:flex;border-radius:var(--r-s);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden;background:var(--card)}
.seg button{
  flex:1;height:40px;border:0;background:transparent;font:inherit;font-size:13px;
  color:var(--ink);cursor:pointer;position:relative;padding:0 4px;
}
.seg button+button::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:1px;background:var(--line)}
.seg button[aria-pressed="true"]{background:var(--brand);color:#fff;box-shadow:0 0 0 1px var(--brand)}
.seg button[aria-pressed="true"]+button::before,
.seg button[aria-pressed="true"]::before{opacity:0}
.seg.big button{height:48px;font-size:14px}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;line-height:20px}
.control{
  height:48px;border:0;border-radius:var(--r-s);box-shadow:inset 0 0 0 1px var(--line);
  background:var(--card);display:flex;align-items:center;padding:0 12px;
  font-size:14px;color:var(--ink);width:100%;font-family:inherit;-webkit-appearance:none;appearance:none;
}
.control:focus{outline:none;box-shadow:inset 0 0 0 2px var(--brand)}
.control.picker{cursor:pointer;justify-content:space-between;gap:8px;text-align:left}
.control.picker .val{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.control.picker .val.ph{color:var(--ink-30)}
.control.picker svg{opacity:.5;flex:none}
.prow{display:flex;align-items:flex-start;gap:10px;padding:10px 0}
.prow+.prow{border-top:1px solid var(--line)}
.pico{width:20px;height:20px;flex:none;border-radius:50%;display:grid;place-items:center;margin-top:1px}
.pico.ok{background:rgba(34,195,142,.16);color:var(--success-ink)}
.pico.bad{background:rgba(235,87,87,.14);color:var(--alert)}
.pico.na{background:var(--stripe);color:var(--ink-30)}
.psum{display:flex;gap:8px}
.psum div{flex:1;border-radius:var(--r-s);padding:10px;background:var(--stripe);text-align:center}
.psum b{display:block;font-size:20px;font-weight:700;line-height:24px}
.psum span{font-size:10px;line-height:14px;color:var(--ink-60)}
.psum .ok b{color:var(--success-ink)} .psum .bad b{color:var(--alert)}
.opt{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;min-height:56px}
.opt:active{background:var(--stripe)}
.opt.sel{background:var(--stripe)}
.opt .tick{margin-left:auto;color:var(--brand);opacity:0;flex:none}
.opt.danger .t14{color:var(--alert)}
.opt.danger .iconbox{color:var(--alert);background:rgba(235,87,87,.12)}
.opt.sel .tick{opacity:1}
.opt .cdot{width:10px;height:10px;border-radius:50%;flex:none}
select.control{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 16 16'><path d='M4 6l4 4 4-4' fill='none' stroke='%23002033' stroke-opacity='.5' stroke-width='1.5'/></svg>");background-repeat:no-repeat;background-position:right 12px center}
textarea.control{height:88px;padding:12px;resize:none;line-height:19px}
.control::placeholder{color:var(--ink-30)}

.informer{
  background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);
  padding:14px 16px 14px 18px;position:relative;overflow:hidden;display:flex;gap:12px;
}
.informer::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--warn)}
.informer.system::before{background:var(--info)}
.informer .ico{color:var(--warn-ink);flex:none;margin-top:1px}
.informer.system .ico{color:var(--info)}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:8px;position:relative}
.tile-top{display:flex;align-items:center}
.tile.wide{grid-column:1/-1;flex-direction:row;align-items:center;gap:12px}
.tile.wide .num{position:static}
.feed-row{display:flex;gap:12px;align-items:flex-start;padding:12px 16px 12px 13px;cursor:pointer;position:relative;border-left:3px solid transparent}
.feed-row:active{background:var(--stripe)}
.feed-row.urgent{border-left-color:var(--alert)}
.feed-st{font-weight:600}
.feed-st.alert{color:var(--alert)}
.feed-st.warn{color:var(--warn-ink)}
.tile .num{position:absolute;top:12px;right:12px}
.num{
  display:inline-flex;align-items:center;justify-content:center;
  height:20px;min-width:20px;padding:0 6px;border-radius:10px;
  font-size:11px;font-weight:600;line-height:1;color:#fff;
}
.num.one{padding:0;width:20px}
.num.alert{background:var(--alert)} .num.warn{background:var(--warn)}
.num.info{background:var(--info)} .num.success{background:var(--success)} .num.normal{background:var(--info)}

.vcard{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;cursor:pointer;position:relative}
.vcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
.vcard.crit-alert::before{background:var(--alert)}
.vcard.crit-warn::before{background:var(--warn)}
.vcard.crit-normal::before{background:var(--info)}
.vcard-in{padding:10px 12px 10px 14px;display:flex;flex-direction:column;gap:8px}
.thumb{
  width:52px;height:52px;flex:0 0 52px;border-radius:var(--r-s);background:var(--stripe);
  display:grid;place-items:center;color:var(--ink-30);overflow:hidden;position:relative;
  background-size:cover;background-position:center;
}
.shot-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.thumb.shot{filter:saturate(.55) contrast(1.06)}
.thumb.shot::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,32,51,.05),rgba(0,32,51,.35))}
.thumb.shot svg{display:none}
.vfoot{display:flex;align-items:center;gap:8px;padding-top:6px;border-top:1px solid var(--line)}

.tl{width:100%;height:30px;border-radius:6px;overflow:hidden;display:flex;background:var(--stripe)}
.tl i{display:block;height:100%}
.tl i.prod{background:var(--success)}
.tl i.stop{background:var(--warn)}
.tl i.gap{background:transparent}
.ticks{display:flex;justify-content:space-between;font-size:10px;color:var(--ink-30);margin-top:4px}
.legend{display:flex;gap:16px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-60)}
.legend i{width:10px;height:10px;border-radius:3px;display:block}
.blocks{display:flex;gap:4px}
.blocks i{flex:1;height:22px;border-radius:4px;background:var(--stripe);display:block}
.blocks i.on{background:var(--success)}
.spark{width:100%;height:76px;display:block;overflow:visible}
.progress{height:6px;border-radius:3px;background:var(--stripe);overflow:hidden}
.progress i{display:block;height:100%;background:var(--brand);border-radius:3px;transition:width .25s ease}

.photos{display:flex;gap:8px;flex-wrap:wrap}
.photo{width:80px;height:80px;border-radius:var(--r-s);background:var(--stripe);display:grid;place-items:center;color:var(--ink-30);font-size:10px;text-align:center;position:relative;overflow:hidden}
.photo.shot{filter:saturate(.6) contrast(1.05)}
.photo.add{background:transparent;border:1px dashed var(--line);cursor:pointer;gap:2px;color:var(--ink-60)}
.photo.add span{display:block}

.note{background:var(--stripe);border-radius:var(--r-s);padding:12px;display:flex;flex-direction:column;gap:10px}

.media{
  border-radius:var(--r);background:var(--stripe);min-height:132px;position:relative;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--ink-30);
  background-size:cover;background-position:center;
}
.media.shot{height:180px;filter:saturate(.6) contrast(1.05)}
.media.shot>*{display:none}
.media.shot>.shot-img{display:block}
.media .frame-ui{display:block!important;position:absolute;inset:0;color:#fff}
.media .bbox{
  position:absolute;left:28%;top:24%;width:34%;height:52%;
  border:2px solid var(--alert);border-radius:3px;box-shadow:0 0 0 9999px rgba(0,13,26,.28);
}
.media .bbox b{
  position:absolute;top:-19px;left:-2px;background:var(--alert);color:#fff;
  font-size:9px;font-weight:600;line-height:1;padding:3px 5px;border-radius:3px;white-space:nowrap;
}
.media .stamp{
  position:absolute;left:10px;bottom:10px;background:rgba(0,13,26,.6);color:#fff;
  font-size:10px;line-height:1;padding:5px 7px;border-radius:4px;letter-spacing:.3px;
}
.media .cam{
  position:absolute;right:10px;top:10px;background:rgba(0,13,26,.6);color:#fff;
  font-size:10px;line-height:1;padding:5px 7px;border-radius:4px;display:flex;align-items:center;gap:5px;
}
.media .cam i{width:6px;height:6px;border-radius:50%;background:var(--alert);animation:rec 1.6s steps(1,end) infinite}
@keyframes rec{50%{opacity:.2}}
.photo{background-size:cover;background-position:center}

/* ---------- hero ---------- */
.hero{
  margin:-12px -12px 0;padding:18px 16px 44px;color:#fff;
  background:linear-gradient(112deg,#0b2036 0%,#123a63 48%,#1e5ea6 100%);
  border-radius:0 0 12px 12px;position:relative;overflow:hidden;
}
.hero::after{
  content:"";position:absolute;right:-40px;top:-60px;width:180px;height:180px;border-radius:50%;
  background:radial-gradient(circle,rgba(60,122,223,.55),transparent 68%);pointer-events:none;
}
.hero-eyebrow{font-size:10px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;opacity:.6}
.hero-title{
  background:none;border:0;padding:2px 0 0;margin:0;color:#fff;font:inherit;
  font-size:22px;font-weight:700;line-height:28px;text-align:left;
  display:flex;align-items:center;gap:6px;cursor:pointer;position:relative;z-index:1;
}
.hero-title svg{opacity:.6;flex:none;transform:translateY(1px)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;position:relative;z-index:1}
.chips span{
  background:rgba(255,255,255,.14);border-radius:99px;padding:4px 10px;
  font-size:11px;line-height:15px;color:rgba(255,255,255,.92);white-space:nowrap;
}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:-32px;position:relative;z-index:2}
.metric.small .m-value{font-size:22px;line-height:26px}
.hero-dots{
  position:absolute;top:14px;right:12px;z-index:2;width:36px;height:36px;border:0;
  border-radius:50%;background:rgba(255,255,255,.16);color:#fff;
  display:grid;place-items:center;cursor:pointer;
}
.hero-dots:active{background:rgba(255,255,255,.28)}
.card-dots{
  width:32px;height:32px;flex:none;border:0;border-radius:8px;background:transparent;
  color:var(--ink-60);display:grid;place-items:center;cursor:pointer;
}
.card-dots:active{background:var(--stripe)}
.hero-chip{
  background:rgba(255,255,255,.14);border:0;border-radius:99px;padding:4px 10px;
  font:inherit;font-size:11px;line-height:15px;color:#fff;cursor:pointer;
}
.metric{border-radius:var(--r);padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px;color:#fff}
.metric.green{background:var(--success)}
.metric.warn{background:var(--warn)}
.metric.red{background:var(--alert)}
.metric.red{background:var(--alert);cursor:pointer}
.metric.flat{background:var(--card);color:var(--ink)}
.m-label{font-size:11px;line-height:15px;opacity:.85;font-weight:500}
.m-value{font-size:30px;font-weight:700;line-height:34px;display:flex;align-items:baseline;gap:4px}
.m-value i{font-size:12px;font-weight:500;font-style:normal;opacity:.7}
.m-note{font-size:11px;line-height:15px;opacity:.85}

/* ---------- action bar + nav ---------- */
.actionbar{
  position:absolute;left:0;right:0;background:var(--card);border-top:1px solid var(--line);
  box-shadow:var(--shadow-up);padding:12px;display:flex;flex-direction:column;gap:8px;z-index:5;
}
.actionbar.row2{flex-direction:row}
.nav{
  position:absolute;left:0;right:0;bottom:0;height:var(--nav);background:var(--card);
  border-top:1px solid var(--line);display:flex;z-index:5;
}
.nav button{
  flex:1;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;color:var(--ink-60);font:inherit;font-size:10px;padding:0;
}
.nav button[aria-current="true"]{color:var(--ink);font-weight:600}
.nav .ni{position:relative;width:24px;height:24px;display:grid;place-items:center}
.nav .ni em{position:absolute;top:-1px;right:-2px;width:6px;height:6px;border-radius:50%;background:var(--alert)}

/* ---------- sheet ---------- */
.scrim{position:absolute;inset:0;background:rgba(0,13,26,.45);opacity:0;pointer-events:none;transition:opacity .22s ease;z-index:8}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:absolute;left:0;right:0;bottom:0;background:var(--card);
  border-radius:12px 12px 0 0;box-shadow:0 -4px 16px rgba(0,32,51,.16);
  transform:translateY(110%);transition:transform .28s cubic-bezier(.32,.72,0,1);
  z-index:9;max-height:88%;display:flex;flex-direction:column;
}
.sheet.on{transform:translateY(0)}
.sheet.dragging{transition:none}
.handle{padding:8px 0 4px;display:grid;place-items:center;cursor:grab;touch-action:none}
.handle i{width:36px;height:4px;border-radius:2px;background:var(--line);display:block}
.sheet-body{padding:8px 16px 0;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.sheet-actions{padding:12px 16px 16px;display:flex;gap:8px}
.sheet-list{padding:0 0 8px}
.sheet-item{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;position:relative}
.sheet-item:active{background:var(--stripe)}
.sheet-item.sel{background:var(--stripe)}
.sheet-item.sel::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--success)}
.sheet-item .meta{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sheet-list{display:flex;flex-direction:column}

/* ---------- alert overlay ---------- */
.alert-ovl{position:absolute;inset:0;background:rgba(0,13,26,.55);display:none;z-index:12;padding:16px;overflow-y:auto}
.alert-ovl.on{display:flex;align-items:center}
.alert-card{background:var(--bg);border-radius:16px;overflow:hidden;width:100%;box-shadow:0 20px 50px rgba(0,32,51,.4)}
.alert-hero{background:var(--alert);color:#fff;padding:24px 16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.alert-ring{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.45)}70%{box-shadow:0 0 0 18px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
.alert-eyebrow{font-size:11px;font-weight:600;letter-spacing:.6px;opacity:.85;text-transform:uppercase}
.alert-title{font-size:20px;font-weight:700;line-height:26px}
.alert-body{padding:16px;display:flex;flex-direction:column;gap:12px}
.kv{display:flex;gap:12px;font-size:12px;line-height:17px}
.kv b{flex:none;width:88px;font-weight:400;color:var(--ink-60)}
.kv span{font-weight:500}

/* ---------- toast ---------- */
.toast{
  position:absolute;left:12px;right:12px;bottom:76px;background:var(--ink);color:#fff;
  border-radius:var(--r-s);padding:12px 14px;font-size:13px;line-height:18px;z-index:20;
  opacity:0;transform:translateY(8px);transition:.2s ease;pointer-events:none;
}
.toast.on{opacity:1;transform:none}

.msg{max-width:82%;background:var(--card);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow);align-self:flex-start}
.msg.mine{align-self:flex-end;background:var(--brand);color:#fff}
.msg-who{font-size:10px;line-height:14px;color:var(--ink-60);margin-bottom:2px}
.msg.mine .msg-who{color:rgba(255,255,255,.75)}
.msg-text{font-size:13px;line-height:18px}
.msg-time{font-size:10px;line-height:14px;color:var(--ink-30);margin-top:3px;text-align:right}
.msg.mine .msg-time{color:rgba(255,255,255,.7)}
.chatbar{display:flex;gap:8px;align-items:center}
.desk .chatbar input{height:48px;font-size:14px}
.chatbar input{flex:1;height:44px;border-radius:22px;box-shadow:inset 0 0 0 1px var(--line);background:var(--card);padding:0 16px;font:inherit;font-size:14px;border:0}
.chatbar button{width:44px;height:44px;border-radius:50%;border:0;background:var(--brand);color:#fff;cursor:pointer;display:grid;place-items:center;flex:none}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:40px 24px;text-align:center;color:var(--ink-60)}

/* ---------- devtools ---------- */
.devtools{
  position:fixed;top:0;right:0;bottom:0;width:332px;overflow-y:auto;overscroll-behavior:contain;
  background:#fff;padding:0 16px 24px;box-shadow:-8px 0 28px rgba(0,32,51,.10);
  display:flex;flex-direction:column;gap:12px;font-size:12px;color:var(--ink-60);z-index:50;
}
.devtools h4{
  position:sticky;top:0;background:#fff;margin:0;padding:18px 0 10px;z-index:1;
  border-bottom:1px solid var(--line);
}
.dev-state{background:var(--stripe);border-radius:8px;padding:8px 10px;line-height:17px;color:var(--ink)}
.dev-state b{font-weight:600}
.dev-cap{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-30);font-weight:600}
.dev-group{display:flex;flex-direction:column;gap:6px}
.dev-sc{
  display:flex;align-items:flex-start;gap:10px;text-align:left;padding:10px;
  height:auto;min-height:0;width:100%;
  border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;font:inherit;
}
.dev-sc>span{flex:1;min-width:0}
.dev-sc:hover{border-color:var(--brand)}
.dev-sc:active{background:var(--stripe)}
.dev-sc em{
  font-style:normal;flex:none;min-width:30px;height:20px;padding:0 5px;border-radius:6px;
  background:var(--stripe);color:var(--ink);font-size:11px;font-weight:700;
  display:grid;place-items:center;margin-top:1px;
}
.dev-sc span{display:block;font-size:12px;line-height:16px;color:var(--ink);white-space:normal}
.dev-sc small{display:block;font-size:10px;line-height:14px;color:var(--ink-60);margin-top:2px;white-space:normal}
.dev-row{display:flex;gap:6px}
.dev-row button{flex:1}
.devtools h4{font-size:13px;color:var(--ink)}
.devtools .dev-row button{
  height:36px;border-radius:8px;border:1px solid var(--line);background:#fff;
  font:inherit;font-size:12px;color:var(--ink);cursor:pointer;
}
.devtools .dev-row button:active{background:var(--stripe)}
.devtools .hintlist{margin:0;padding-left:16px;line-height:18px}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

/* Подставьте сюда реальные кадры СИАМ или фото супервайзера:
   SHOTS['<id нарушения>'] = 'https://…' — больше ничего менять не нужно.
   По умолчанию — свободные фото (picsum.photos), обработанные под кадр камеры. */
const shotUrl=(seed,w,h,tags)=>
  `https://loremflickr.com/${w}/${h}/${tags||'oilrig,drilling,industrial'}?lock=${seed}`;
const fallbackUrl=(seed,w,h)=>`https://picsum.photos/seed/brd-${seed}/${w}/${h}`;
/* <img> вместо фона — чтобы поймать onerror и подставить запасной источник */
const shotImg=(seed,w,h,tags)=>
  `<img class="shot-img" alt="" loading="lazy" src="${shotUrl(seed,w,h,tags)}"
     onerror="this.onerror=null;this.src='${fallbackUrl(seed,w,h)}'">`;
const SHOTS={};
/* подбор ключевых слов под тип нарушения — кадр совпадает по смыслу с записью */
function shotTags(v){
  const t=(v.title||'').toLowerCase();
  if(t.includes('ротор')||t.includes('обвязк')||t.includes('пво'))return 'drilling,rig,floor';
  if(t.includes('мостк')||t.includes('огражд')||t.includes('настил'))return 'scaffolding,industrial,platform';
  if(t.includes('сиз')||t.includes('каск'))return 'worker,helmet,industrial';
  if(t.includes('давлен')||t.includes('загазован'))return 'pipeline,valve,gauge';
  if(t.includes('наряд')||t.includes('допуск'))return 'oilrig,construction,site';
  return 'oilrig,drilling,industrial';
}
const shotFor=(id,w,h,tags)=>SHOTS[id]||shotUrl(id,w,h,tags);

function seedItems(found){
  const secs=freshCl('obj');
  const flat=[];secs.forEach(x=>x.items.forEach(i=>flat.push(i)));
  flat.forEach((i,idx)=>{
    i.v = idx<found ? 'bad' : (idx%7===3 ? 'na' : 'ok');
    if(i.v==='bad'){i.note='Выявлено при обходе, выдан ПКМ подрядчику.';i.photos=1;}
  });
  return secs;
}

};

    return;

    [homeScreen(),isRoving()?'Маршрут':'Главная',I.home(S.screen===homeScreen()),0],

    ['summary','Сводка',I.nchart,0],
    ['more','Ещё',I.nmore,0]
  ];
  nav.innerHTML=items.map(([id,label,icon,badge])=>`
    <button data-act="go" data-screen="${id}" aria-current="${S.screen===id}">
      <span class="ni">${icon}${badge?'<em></em>':''}</span>${label}

function feedItems(){
  const out=[], o=obj();
  V().filter(v=>v.status==='new').forEach(v=>out.push({
    p:1,ico:'alert',st:'Новое',tone:'alert',title:v.title,
    meta:'Нарушения · '+v.source+' · '+v.time,
    act:'open-v',id:v.id}));
  if(isCustomer())V().filter(v=>v.status==='work'&&v.awaiting).forEach(v=>out.push({
    p:2,ico:'alert',st:'Проверить устранение',tone:'warn',title:v.title,
    meta:'Нарушения · подрядчик сообщил о выполнении',act:'open-v',id:v.id}));
  TASKS().filter(t=>t.status==='overdue').forEach(t=>out.push({
    p:1,ico:'chat',st:'Просрочено',tone:'alert',title:t.title,
    meta:'Поручения · срок '+t.due,act:'open-task',id:t.id}));
  TASKS().filter(t=>t.status==='new').forEach(t=>out.push({
    p:3,ico:'chat',st:'Новое',tone:'warn',title:t.title,
    meta:'Поручения · срок '+t.due,act:'open-task',id:t.id}));
  const m=SUM();
  if(m&&isCustomer()&&m.status==='pending')out.push({
    p:2,ico:'chart',st:'Ждёт подтверждения',tone:'warn',title:SUM_KIND[m.kind]+' за '+m.date,
    meta:'Сводка · '+m.author,act:'go',screen:'summary'});
  if(m&&!isCustomer()&&(m.status==='returned'||m.status==='draft'))out.push({
    p:2,ico:'chart',st:m.status==='returned'?'Возвращена':'Не отправлена',tone:'alert',
    title:SUM_KIND[m.kind]+' за '+m.date,
    meta:'Сводка · '+(m.status==='returned'?'заказчик вернул на доработку':'черновик'),act:'go',screen:'summary'});
  DOCS().filter(d=>isCustomer()?d.status==='review':d.status==='rejected').forEach(d=>out.push({
    p:2,ico:'list',st:isCustomer()?'Ждёт согласования':'Возвращён',tone:'warn',title:d.title,
    meta:'Документация · '+d.num+' · '+d.ver,
    act:'open-doc',id:d.id}));
  CH().filter(c=>c.status==='draft').forEach(c=>out.push({
    p:3,ico:'list',st:'Черновик',tone:'warn',title:checkLabel(c.type),
    meta:'Проверки · пройдено '+c.items.filter(i=>i.v).length+' из '+c.items.length,
    act:'open-check',id:c.id}));
  CH().filter(c=>c.status==='done'&&!c.sent).forEach(c=>out.push({
    p:3,ico:'list',st:'Не отправлен',tone:'alert',title:checkLabel(c.type),
    meta:'Проверки · протокол ждёт связи с ЭРА-Ремонты',act:'open-check',id:c.id}));
  return out.sort((a,b)=>a.p-b.p);
}

const hm=t=>{const [h,m]=t.split(':').map(Number);return h*60+m;};
function shiftViz(m){
  const ops=m.ops.filter(o=>o.t&&o.t.indexOf('–')>0);
  if(!ops.length)return '';
  const seg=ops.map(o=>{const [a,b]=o.t.split('–');return {from:hm(a),to:hm(b)<hm(a)?hm(b)+1440:hm(b),kind:o.kind,n:o.n,d:o.d,why:o.why};});
  const start=seg[0].from, end=seg[seg.length-1].to, total=end-start||1;
  let cursor=start, parts=[];
  seg.forEach(x=>{
    if(x.from>cursor)parts.push(`<i class="gap" style="width:${(x.from-cursor)/total*100}%"></i>`);
    parts.push(`<i class="${x.kind}" style="width:${(x.to-x.from)/total*100}%" title="${x.n} · ${x.d}"></i>`);
    cursor=x.to;
  });
  const prod=seg.filter(x=>x.kind==='prod').reduce((a,x)=>a+(x.to-x.from),0);
  const stop=seg.filter(x=>x.kind==='stop').reduce((a,x)=>a+(x.to-x.from),0);
  const fmt=v=>Math.floor(v/60)+' ч '+String(v%60).padStart(2,'0')+' мин';
  const lbl=v=>String(Math.floor(v/60)%24).padStart(2,'0')+':'+String(v%60).padStart(2,'0');
  const mid=start+Math.round(total/2);
  return `
  <div class="card col" style="gap:12px">
    <div class="t14">Как прошла смена</div>
    <div>
      <div class="tl">${parts.join('')}</div>
      <div class="ticks"><span>${lbl(start)}</span><span>${lbl(mid)}</span><span>${lbl(end)}</span></div>
    </div>
    <div class="legend">
      <span><i style="background:var(--success)"></i>Производительно · ${fmt(prod)} (${Math.round(prod/(prod+stop||1)*100)} %)</span>
      <span><i style="background:var(--warn)"></i>Простои · ${fmt(stop)}</span>
    </div>
    ${stop?`<div class="hr"></div>
      ${seg.filter(x=>x.kind==='stop').map(x=>`
        <div class="kv"><b>${x.d}</b><span>${x.n}${x.why?' · '+x.why.toLowerCase():''}</span></div>`).join('')}`:''}
  </div>`;
}
function vmrViz(m){
  const bl=(m.facts.find(f=>/блок/i.test(f[0]))||[])[1]||'';
  const mm=bl.match(/(\d+)\s*из\s*(\d+)/);
  if(!mm)return '';
  const done=+mm[1], all=+mm[2];
  const rd=(m.facts.find(f=>/готовност/i.test(f[0]))||[])[1]||'';
  return `
  <div class="card col" style="gap:12px">
    <div class="row"><div class="t14 grow">Монтаж блоков</div><div class="t12 muted">${done} из ${all}</div></div>
    <div class="blocks">${Array.from({length:all},(_,i)=>`<i class="${i<done?'on':''}"></i>`).join('')}</div>
    <div class="t11 ghosted">Готовность ВМР ${rd}</div>
  </div>`;
}
function trendViz(kind){
  const pts=SUMS().filter(x=>x.kind===kind).map(x=>{
    const f=(x.facts.find(f=>/готовност/i.test(f[0]))||[])[1]||'';
    const n=parseFloat(String(f).replace(',','.'));
    return isNaN(n)?null:{v:n,d:x.date.slice(0,5)};
  }).filter(Boolean).reverse();
  if(pts.length<2)return '';
  const w=311,h=52,max=Math.max(...pts.map(p=>p.v)),min=Math.min(...pts.map(p=>p.v));
  const rng=(max-min)||1;
  const xy=pts.map((p,i)=>[i/(pts.length-1)*w, h-((p.v-min)/rng)*(h-10)-5]);
  const line=xy.map((c,i)=>(i?'L':'M')+c[0].toFixed(1)+' '+c[1].toFixed(1)).join(' ');
  const area=line+` L${w} ${h} L0 ${h} Z`;
  const last=xy[xy.length-1];
  return `
  <div class="card col" style="gap:10px">
    <div class="row"><div class="t14 grow">Динамика готовности</div>
      <div class="t12" style="color:var(--success-ink)">+${(pts[pts.length-1].v-pts[0].v).toFixed(0)} п.п. за ${pts.length} смены</div></div>
    <svg class="spark" viewBox="0 0 ${w} ${h+18}" preserveAspectRatio="none">
      <path d="${area}" fill="var(--brand)" opacity=".10"/>
      <path d="${line}" fill="none" stroke="var(--brand)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      ${xy.map(c=>`<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="3" fill="var(--card)" stroke="var(--brand)" stroke-width="2"/>`).join('')}
      <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="4.5" fill="var(--brand)"/>
      ${pts.map((p,i)=>`<text x="${xy[i][0].toFixed(1)}" y="${h+14}" font-size="9" fill="rgba(0,32,51,.4)"
        text-anchor="${i===0?'start':(i===pts.length-1?'end':'middle')}">${p.d}</text>`).join('')}
    </svg>
  </div>`;
}

/* ======================= action bar ======================= */
function renderBar(){
  const slot=document.getElementById('barSlot');
  if(isOffice()){slot.innerHTML='';return;}
  const homeish=(S.screen===homeScreen());
  if(homeish&&!shiftOn()){
    slot.innerHTML=`<div class="actionbar" style="bottom:60px">
      <button class="btn primary block" data-act="start-shift">Принять смену</button></div>`;
    return;
  }
  if(homeish&&shiftOn()){
    slot.innerHTML=`<div class="actionbar" style="bottom:60px">
      <button class="btn secondary block" data-act="ask-finish-shift">Сдать смену</button></div>`;
    return;
  }
  const navH=['newv','checklist','fixcheck','notifications','docs','kb','files','analytics','tasks','task'].includes(S.screen)?0:60;
  let html='';
  if(S.screen==='registry'){
    html=`<div class="actionbar" style="bottom:${navH}px">
      <button class="btn primary block" data-act="go" data-screen="newv">${I.plus} Зафиксировать нарушение</button></div>`;
  } else if(S.screen==='newv'){
    html=`<div class="actionbar" style="bottom:0">
      <button class="btn primary block" data-act="save-v">${S.online?'Отправить в реестр':'Сохранить в офлайн-очередь'}</button>
      <button class="btn clear block" data-act="back">Отменить</button></div>`;
  } else if(S.screen==='checks'){
    html=`<div class="actionbar" style="bottom:${navH}px">
      <button class="btn primary block" data-act="start-check">${I.plus} Начать проверку</button></div>`;
  } else if(S.screen==='summary'&&SUM()){
    const m=SUM();
    if(isCustomer()){
      html=(m.status==='pending')?`<div class="actionbar" style="bottom:${navH}px">
        <button class="btn primary block" data-act="confirm-sum">Подтвердить сводку</button>
        <button class="btn clear block" data-act="return-sum">Вернуть на доработку</button></div>`:'';
    } else {
      html=(m.status==='draft'||m.status==='returned')?`<div class="actionbar" style="bottom:${navH}px">
        <button class="btn primary block" data-act="send-sum">Отправить на подтверждение</button></div>`:'';
    }
  } else if(S.screen==='tasks'){
    html=isCustomer()?`<div class="actionbar" style="bottom:0">
      <button class="btn primary block" data-act="new-task">${I.plus} Выдать поручение</button></div>`:'';
  } else if(S.screen==='task'){
    const t=activeTask();
    html=`<div class="actionbar row2" style="bottom:0">
      <div class="chatbar" style="width:100%">
        <input id="msgInput" placeholder="Сообщение по поручению">
        <button data-act="send-msg" aria-label="Отправить">${I.tick}</button>
      </div>
    </div>`;
    if(t&&t.status!=='done'){
      html=`<div class="actionbar" style="bottom:0">
        <div class="chatbar">
          <input id="msgInput" placeholder="Сообщение по поручению">
          <button data-act="send-msg" aria-label="Отправить">${I.tick}</button>
        </div>
        ${isCustomer()
          ? `<button class="btn clear block" data-act="close-task">Закрыть поручение</button>`
          : `<button class="btn clear block" data-act="report-task">Сообщить о выполнении</button>`}
      </div>`;
    }
  } else if(S.screen==='notifications'){
    html=unread()?`<div class="actionbar" style="bottom:0">
      <button class="btn secondary block" data-act="mark-read">Отметить всё прочитанным</button></div>`:'';
  } else if(S.screen==='fixcheck'){
    const fx=(activeCheck()&&activeCheck().fixes)||[];
    const ok=fx.length&&fx.every(f=>f.result)&&fx.filter(f=>f.result==='done').every(f=>f.photos>0);
    html=`<div class="actionbar" style="bottom:0">
      <button class="btn primary block" data-act="finish-fx" ${ok?'':'disabled'}>Завершить и отправить</button>
      <button class="btn clear block" data-act="draft">Сохранить черновик</button></div>`;
  } else if(S.screen==='checklist'&&activeCheck()&&activeCheck().status==='done'){
    const c=activeCheck();
    html=`<div class="actionbar" style="bottom:0">
      ${c.sent
        ? `<button class="btn secondary block" data-act="repeat-check">Повторить проверку</button>`
        : `<button class="btn primary block" data-act="send-check">Отправить в ЭРА-Ремонты</button>`}
      <button class="btn clear block" data-act="back">Закрыть</button></div>`;
  } else if(S.screen==='checklist'){
    const bad=clFlat().filter(i=>i.v==='bad');
    const ok=clDone()===clFlat().length && bad.every(i=>i.photos>0);
    html=`<div class="actionbar" style="bottom:0">
      <button class="btn primary block" data-act="finish-cl" ${ok?'':'disabled'}>Завершить проверку и отправить</button>
      <button class="btn clear block" data-act="draft">Сохранить черновик</button></div>`;
  }
  slot.innerHTML=html;
}

      <div class="sheet-list">

            <div class="iconbox s">${it.v?I.alert:I.list}</div>
            <div class="col grow" style="gap:1px">
              <span class="t14">${it.v?it.v.title:checkLabel(it.c.type)}</span>
              <span class="t11 muted">${it.o.kust} · ${it.o.well}</span>

      </div>
      ${items.length?`<div class="sheet-actions">
        <button class="btn primary block" data-act="flush-queue">${S.online?'Отправить всё':'Нет связи — ждём подключения'}</button>
      </div>`:''}`;

  if(S.sheet.kind==='planops'){
    html+=`<div class="sheet-body" style="padding-bottom:4px"><div class="h1">Операция по плану работ</div>

            <div class="col grow" style="gap:1px">

              <span class="t11 muted">План работ ПР-25/08 · п. ${i+1}</span>

      </div>`;

  if(S.sheet.kind==='checktype'){
    html+=`<div class="sheet-body" style="padding-bottom:4px"><div class="h1">Начать проверку</div>
      <div class="t12 muted" style="margin-top:-6px">Чек-лист уйдёт в ЭРА-Ремонты после завершения</div></div>
      <div class="sheet-list">
        ${CHECK_TYPES.filter(t=>t.v!=='fix'||isCustomer()).map(t=>`
          <div class="opt" data-act="pick-check" data-v="${t.v}">
            <div class="iconbox s">${I.list}</div>
            <div class="col grow" style="gap:1px">
              <span class="t14">${t.l}</span>
              <span class="t11 muted">${t.sub}</span>
            </div>
            ${t.ask?'<span class="badge tint warn">уточняется</span>':''}
          </div>`).join('')}
      </div>`;
  }
  if(S.sheet.kind==='picker'){
    const c=pickerConf(S.sheet.field), cur=pf()[S.sheet.field];
    html+=`<div class="sheet-body" style="padding-bottom:4px"><div class="h1">${c.title}</div></div>
      <div class="sheet-list">
        ${c.opts.map(o=>`
          <div class="opt ${o.v===cur?'sel':''}" data-act="pick-opt" data-v="${o.v}">
            ${o.tone?`<i class="cdot" style="background:var(--${o.tone==='alert'?'alert':o.tone==='warn'?'warn':'info'})"></i>`:''}
            <span class="t14">${o.l}</span>
            <span class="tick">${I.tick}</span>
          </div>`).join('')}
      </div>`;
  }
  const prevBody=el.querySelector('.sheet-body');
  const keepSheet=(S.sheet.kind===lastSheetKind&&prevBody)?prevBody.scrollTop:0;
  lastSheetKind=S.sheet.kind;
  el.innerHTML=html;el.style.transform='';
  const nb=el.querySelector('.sheet-body');if(nb)nb.scrollTop=keepSheet;
  requestAnimationFrame(()=>{el.classList.add('on');sc.classList.add('on');});
}

/* ======================= helpers ======================= */
function plural(n,a,b,c){const m=n%100,k=n%10;if(m>10&&m<20)return c;if(k===1)return a;if(k>1&&k<5)return b;return c;}
let toastT;
function toast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2600);
}
let lastScreen=null;
function render(){
  const ph=document.getElementById('phone'), dk=document.getElementById('desk');
  if(isOffice()){
    if(ph)ph.style.display='none';
    if(dk)dk.classList.add('on');
    renderDesk(); lastScreen=S.screen; renderRoles(); renderMap(); return;
  }
  if(ph)ph.style.display='flex';
  if(dk)dk.classList.remove('on');
  const b=document.getElementById('body');
  /* скролл сбрасываем только при смене экрана — иначе отметка пункта
     в чек-листе выбрасывала бы наверх при каждом тапе */
  const keep=(lastScreen===S.screen)?b.scrollTop:0;
  renderStatusBar();renderHeader();renderNav();renderBar();
  const map={home:scrHome,registry:scrRegistry,newv:scrNew,checks:scrChecks,checklist:scrChecklist,fixcheck:scrFixCheck,notifications:scrNotifications,docs:scrDocs,route:scrRoute,kb:scrKb,files:scrFiles,analytics:scrAnalytics,
    fund:scrFund,well:scrWell,gti:scrGti,cb:scrCb,knbk:scrKnbk,video:scrVideo,dash:scrDash,ai:scrAi,tasks:scrTasks,task:scrTask,summary:scrSummary,more:scrMore};
  const cls=['newv','checklist','fixcheck','notifications','docs','kb','files','analytics','tasks','task'].includes(S.screen)?'screen no-nav':(S.screen===homeScreen()?'screen has-bar':(['registry','checks','summary'].includes(S.screen)?'screen has-bar':'screen'));
  b.innerHTML=`<div class="${cls}">${map[S.screen]()}</div>`;
  b.scrollTop=(S.screen==='task'&&lastScreen!=='task')?b.scrollHeight:keep;
  if(S.screen==='task'&&lastScreen==='task')b.scrollTop=b.scrollHeight;
  lastScreen=S.screen;
  renderRoles();renderMap();
}

/* ======================= events ======================= */
const appClick=e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act;
  if(a==='go'){S.screen=el.dataset.screen;if(S.screen==='newv')S.form=newForm();if(S.screen==='summary')S.sumId=null;closeSheet();render();}
  if(a==='back'){S.screen=S.screen==='newv'?'registry':(['checklist','fixcheck'].includes(S.screen)?'checks':(S.screen==='task'?'tasks':homeScreen()));S.activeCheck=S.screen==='checks'?null:S.activeCheck;render();}
  if(a==='toggle-online'){
    S.online=!S.online;
    const q=queueCount();
    toast(S.online?(q?'Связь есть. Отправляю '+q+' '+plural(q,'запись','записи','записей'):'Связь восстановлена'):'Связь потеряна. Записи сохраняются локально');
    if(S.online&&q)Object.values(S.byObj).forEach(d=>d.violations.forEach(v=>v.sent=true));
    render();
  }
  if(a==='sheet-objects')openSheet('objects');
  if(a==='sheet-queue')openSheet('queue');
  if(a==='sheet-shifthistory')openSheet('shifthistory');
  if(a==='start-shift'){startShift();render();
    toast(isRoving()?'Смена принята · маршрут загружен':'Смена принята · данные объекта загружены');}
  if(a==='ask-finish-shift'){S.sheet={kind:'shiftfinish'};S.expanded=false;renderSheet();return;}
  if(a==='finish-shift'){
    const sm=shiftSummary();
    S.shiftHistory.unshift({d:'25.08.2026',sh:'08:00–20:00',obj:sm.visited,v:sm.v,c:sm.c,sent:S.online});
    S.shift=null;S.screen=homeScreen();closeSheet();render();
    toast(S.online?'Смена сдана, отчёт отправлен':'Смена сдана, отчёт уйдёт при подключении');
  }
  if(a==='flush-queue'){
    if(!S.online){toast('Нет связи. Записи уйдут автоматически при подключении');return;}
    Object.values(S.byObj).forEach(d=>{d.violations.forEach(v=>v.sent=true);(d.checks||[]).forEach(c=>c.sent=true);});
    closeSheet();render();toast('Очередь отправлена в ЭРА-Ремонты');
  }
  if(a==='open-notif'){
    const n=S.notifications.find(x=>x.id===+el.dataset.id);
    n.read=true;
    if(n.obj)S.objectId=n.obj;
    if(n.vid){S.screen='registry';S.filter='all';render();openSheet('violation',n.vid);}
    else {S.screen='checks';render();}
  }
  if(a==='picker'){
    S.pickerFor=el.dataset.for||'form';
    if(S.pickerFor==='form'){const d=document.getElementById('fDesc'); if(d)S.form.desc=d.value;}
    else {const ti=document.getElementById('taskTitle'); if(ti)S.taskForm.title=ti.value;}
    S.sheet={kind:'picker',field:el.dataset.field};S.expanded=false;renderSheet();
  }
  if(a==='pick-opt'){
    pf()[S.sheet.field]=el.dataset.v;
    if(S.pickerFor==='task'){S.sheet={kind:'newtask'};renderSheet();}
    else {closeSheet();render();}
  }
  if(a==='close-sheet')closeSheet();
  if(a==='toggle-expand'){S.expanded=!S.expanded;renderSheet();}
  if(a==='pick-route'){S.objectId=el.dataset.id;S.sumId=null;
    if(shiftOn()&&S.shift.visited.indexOf(S.objectId)===-1)S.shift.visited.push(S.objectId);
    S.screen='home';render();
    toast('Объект: '+objShort()); }
  if(a==='pick-object'){S.objectId=el.dataset.id;S.sumId=null;closeSheet();render();toast('Объект переключён: '+objShort());}
  if(a==='mark-read'){S.notifications.forEach(n=>n.read=true);render();toast('Все уведомления прочитаны');}
  if(a==='filter'){S.filter=el.dataset.f;render();}
  if(a==='check-filter'){S.checkFilter=el.dataset.f;render();}
  if(a==='start-check')openSheet('checktype');
  if(a==='pick-op'){S.pickedOp=el.dataset.op;S.sheet={kind:'checktype'};renderSheet();
    toast('Операция выбрана: '+S.pickedOp);return;}
  if(a==='pick-check'){
    if(el.dataset.v==='op'&&!S.pickedOp){S.sheet={kind:'planops'};renderSheet();return;}
    const id=Date.now(),type=el.dataset.v;
    const rec={id,type,date:'Сегодня, 11:20',status:'draft',found:0,sent:false,items:freshCl(type),op:S.pickedOp||null};
    S.pickedOp=null;
    if(type==='fix')rec.fixes=V().filter(v=>v.status==='work').map(v=>({vid:v.id,result:null,photos:0,note:''}));
    CH().unshift(rec);
    S.activeCheck=id;S.screen=type==='fix'?'fixcheck':'checklist';closeSheet();render();
  }
  if(a==='open-check'){
    const cid=+el.dataset.id;
    if(!CH().some(x=>x.id===cid)){const hit=allCH().find(x=>x.c.id===cid); if(hit)S.objectId=hit.o.id;}
    const c=CH().find(x=>x.id===cid);
    S.activeCheck=c.id;S.showOk=false;
    S.screen=c.type==='fix'?'fixcheck':'checklist';
    render();
    if(c.status!=='draft')toast('Проверка завершена — открыта для просмотра');
  }
  if(a==='open-v'){
    const id=+el.dataset.id;
    if(!V().some(v=>v.id===id)){const hit=allV().find(x=>x.v.id===id); if(hit)S.objectId=hit.o.id;}
    openSheet('violation',id);
  }
  if(a==='accept-v'){
    const v=V().find(x=>x.id===S.sheet.id);v.status='work';v.pkm=v.pkm||{who:obj().contractor,due:'Сегодня, 16:00'};
    closeSheet();render();toast('Принято к устранению');
  }
  if(a==='dispute-v'){
    const v=V().find(x=>x.id===S.sheet.id);v.desc=(v.desc||'')+' Подрядчик заявил несогласие, требуется разбор с заказчиком.';
    closeSheet();render();toast('Несогласие зафиксировано, уйдёт заказчику');
  }
  if(a==='report-fix'){
    const v=V().find(x=>x.id===S.sheet.id);v.awaiting=true;
    closeSheet();render();toast('Подтверждение отправлено, ждём проверки заказчика');
  }
  if(a==='pkm-v'){
    const v=V().find(x=>x.id===S.sheet.id);
    v.status='work';v.pkm={who:obj().contractor,due:'Сегодня, 16:00'};
    closeSheet();render();toast('ПКМ сформирован и отправлен подрядчику');
  }
  if(a==='reject-v'){
    D().violations=V().filter(x=>x.id!==S.sheet.id);
    closeSheet();render();toast('Нарушение отклонено, запись уйдёт в архив');
  }
  if(a==='close-v'){
    const v=V().find(x=>x.id===S.sheet.id);v.status='done';
    closeSheet();render();toast('Устранение подтверждено');
  }
  if(a==='add-photo'){
    const d=document.getElementById('fDesc'); if(d)S.form.desc=d.value;
    S.form.photos=Math.min(S.form.photos+1,4);render();
  }
  if(a==='save-v'){
    const F=S.form;
    const d=document.getElementById('fDesc'); if(d)F.desc=d.value;
    if(!F.type){toast('Выберите тип нарушения');return;}
    if(!F.photos){toast('Добавьте хотя бы одно фото — без него замечание не примут');return;}

/* drag the sheet */
(function(){
  const sheet=document.getElementById('sheet');let sy=0,cur=0,drag=false;
  sheet.addEventListener('pointerdown',e=>{
    if(!e.target.closest('.handle'))return;
    drag=true;sy=e.clientY;cur=0;sheet.classList.add('dragging');sheet.setPointerCapture(e.pointerId);
  });
  sheet.addEventListener('pointermove',e=>{
    if(!drag)return;cur=Math.max(e.clientY-sy,-160);
    sheet.style.transform='translateY('+Math.max(cur,-0)+'px)';
    if(cur<-40&&!S.expanded){S.expanded=true;drag=false;sheet.classList.remove('dragging');sheet.style.transform='';renderSheet();}
  });
  sheet.addEventListener('pointerup',()=>{
    if(!drag)return;drag=false;sheet.classList.remove('dragging');
    if(cur>90){sheet.style.transform='';closeSheet();}
    else sheet.style.transform='';
  });
})();

  const scr=el.dataset.screen, sheet=el.dataset.sheet, act=el.dataset.mact;

  if(scr){
    if(scr==='checklist'){const c=CH().find(x=>x.status==='draft')||CH()[0]; if(c)S.activeCheck=c.id;}
    if(scr==='fixcheck'){
      const id=Date.now();
      CH().unshift({id,type:'fix',date:'Сегодня, 11:20',status:'draft',found:0,sent:false,items:freshCl('fix'),
        fixes:V().filter(v=>v.status==='work').map(v=>({vid:v.id,result:null,photos:0,note:''}))});
      S.activeCheck=id;
    }
    if(scr==='task'){const t=TASKS()[0]; if(t)S.taskId=t.id;}
    if(scr==='newv')S.form=newForm();
    S.screen=scr; closeSheet(); render(); return;
  }
  if(sheet){
    if(sheet==='violation'){const v=V()[0]||allV()[0].v; S.screen='registry'; render(); openSheet('violation',v.id); return;}
    if(sheet==='doc'){S.screen='docs'; const d=DOCS()[0]; if(d)S.docId=d.id; render(); openSheet('doc'); return;}
    if(sheet==='shifts'){S.screen='summary'; render(); openSheet('shifts'); return;}
    if(sheet==='checktype'){S.screen='checks'; render(); openSheet('checktype'); return;}
    if(sheet==='shiftfinish'){if(!shiftOn())startShift(); S.screen=homeScreen(); render(); S.sheet={kind:'shiftfinish'}; renderSheet(); return;}
    if(sheet==='shifthistory'){openSheet('shifthistory'); return;}
    if(sheet==='planops'){S.screen='checks'; render(); openSheet('planops'); return;}
    if(sheet==='wells'){S.screen='fund'; render(); openSheet('wells'); return;}
    openSheet(sheet); return;
  }
}

document.querySelector('.side').addEventListener('click',e=>{
  const r=e.target.closest('[data-role]');
  if(r&&!r.disabled){
    S.role=r.dataset.role;
    S.screen=homeScreen(); S.filter='all'; S.checkFilter='all'; S.taskFilter='all';
    S.sumId=null; S.activeCheck=null; S.shift=null; closeSheet(); render();
    toast(ROLES[S.role].title); return;
  }
  const m=e.target.closest('[data-map]'); if(m){goMap(m);return;}
  const b=e.target.closest('[data-dev]'); if(!b)return;
  if(b.dataset.dev==='offline')document.querySelector('[data-act="toggle-online"]').click();
  if(b.dataset.dev==='alert')showAlert();
  if(b.dataset.dev==='reset'){seed();S.screen=homeScreen();S.filter='all';S.online=true;
    S.sumId=null;S.activeCheck=null;closeSheet();render();toast('Данные сброшены');}
});

S.screen=homeScreen();
render();
</script>
</body>
</html>
